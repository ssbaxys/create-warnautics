plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'checkstyle'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+mc.${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Flywheel, Ponder
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.realrobotix.me/master" } // Registrate
    maven { url = "https://maven.neoforged.net/releases/" }
    maven { url = "https://maven.ryanhcode.dev/releases" } // Sable
    maven { url = "https://maven.blamejared.com" } // Veil (Sable transitive)

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

base {
    archivesName = 'Create_Warnautics'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    simulatedBundle
    runtimeClasspath.extendsFrom localRuntime
}

// Simulated is distributed inside Aeronautics. Compile against that nested JAR,
// without embedding a second copy in Warnautics.
def simulatedApi = providers.provider {
    zipTree(configurations.simulatedBundle.singleFile).matching {
        include 'META-INF/jarjar/dev.simulated_team.simulated.simulated-neoforge-*.jar'
    }.singleFile
}

dependencies {
    simulatedBundle('maven.modrinth:create-aeronautics:1.3.2+mc1.21.1') { transitive = false }
    compileOnly(files(simulatedApi))
    implementation("com.simibubi.create:create-${minecraft_version}:${create_neoforge_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_neoforge_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_neoforge_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_neoforge_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_neoforge_version}")

    // Sable (optional at runtime — bombs kick from sub-levels like CBC shells)
    api("dev.ryanhcode.sable:sable-neoforge-${project.minecraft_version}:${project.sable_version}")

    // Create Offroad (optional — wheel raycast detonates large mines; Aeronautics vehicle stack)
    compileOnly("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${offroad_version}") {
        transitive = false
    }

    // Veil (optional — real dynamic lights + post bloom; bundled with Sable)
    compileOnly("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}")

    // Create Big Cannons + RPL (Modrinth artifacts; GitHub Packages needs auth)
    implementation("maven.modrinth:create-big-cannons:${cbc_modrinth_version}")
    implementation("maven.modrinth:rpl:${rpl_modrinth_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            cbc_version_range      : cbc_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/gameTest/java/**/*.java'
        palantirJavaFormat('2.50.0')
        removeUnusedImports()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.21.2'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    exclude '**/generated/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE.txt' }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Opt-in integration tests run in a disposable server with the real Sable/Aeronautics stack.
// Test classes/resources never enter the release JAR.
if (providers.gradleProperty('seaMineTests').isPresent()) {
    sourceSets {
        gameTest {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations.gameTestCompileOnly.extendsFrom(configurations.compileOnly)
    configurations.gameTestImplementation.extendsFrom(configurations.implementation)
    configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
    neoForge.addModdingDependenciesTo(sourceSets.gameTest)
    neoForge.mods.named(mod_id) { sourceSet(sourceSets.gameTest) }
    neoForge.runs.register('seaMineTest') {
        type = 'gameTestServer'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = file("build/game-tests/${System.currentTimeMillis()}")
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        systemProperty 'neoforge.gameTestServer', 'true'
        programArguments.addAll '--mixin', 'cbc_more_content.gametest.mixins.json'
    }
    neoForge.runs.register('aim9Test') {
        type = 'gameTestServer'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = file("build/aim9-tests/${System.currentTimeMillis()}")
        systemProperty 'neoforge.enabledGameTestNamespaces', 'warnautics_aim9'
        systemProperty 'neoforge.gameTestServer', 'true'
        programArguments.addAll '--mixin', 'cbc_more_content.gametest.mixins.json'
    }
    def chainClientDirectory = file("build/chain-client-check/${System.currentTimeMillis()}")
    neoForge.runs.register('chainClientCheck') {
        type = 'client'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = chainClientDirectory
        systemProperty 'warnautics.chainClientCheck', 'true'
        programArguments.addAll '--width', '640', '--height', '480'
    }
    tasks.matching { it.name == 'runChainClientCheck' }.configureEach {
        doLast {
            def result = new File(chainClientDirectory, 'chain-client-check.txt')
            if (!result.exists() || !result.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("Client chain check failed: ${result}")
            }
        }
    }
    def missileFlightDirectory = file("build/missile-flight-check/${System.currentTimeMillis()}")
    neoForge.runs.register('missileFlightCheck') {
        type = 'client'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = missileFlightDirectory
        systemProperty 'warnautics.missileFlightCheck', 'true'
        systemProperty 'warnautics.missileFlightFabulous', providers.gradleProperty('missileFlightFabulous').isPresent().toString()
        jvmArguments.addAll '-Xmx3G', '-XX:ActiveProcessorCount=4'
        programArguments.addAll '--width', '640', '--height', '480'
    }
    tasks.matching { it.name == 'runMissileFlightCheck' }.configureEach {
        doLast {
            def result = new File(missileFlightDirectory, 'missile-flight-check.txt')
            if (!result.exists() || !result.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("Missile flight check failed: ${result}")
            }
            def settings = new File(missileFlightDirectory, 'missile-settings-check.txt')
            if (!settings.exists() || !settings.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("Missile settings check failed: ${settings}")
            }
            def aim9 = new File(missileFlightDirectory, 'aim9-client-check.txt')
            if (!aim9.exists() || !aim9.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("AIM-9 client check failed: ${aim9}")
            }
        }
    }
    def blastFxDirectory = file("build/blast-fx-check/${System.currentTimeMillis()}")
    neoForge.runs.register('blastFxCheck') {
        type = 'client'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = blastFxDirectory
        systemProperty 'warnautics.blastFxCheck', 'true'
        systemProperty 'warnautics.expectSodium', providers.gradleProperty('fxSodiumJar').isPresent().toString()
        systemProperty 'warnautics.blastFxIncludeVolume', providers.gradleProperty('blastFxIncludeVolume').isPresent().toString()
        systemProperty 'warnautics.blastFxIncludeFlight', providers.gradleProperty('blastFxIncludeFlight').isPresent().toString()
        systemProperty 'warnautics.blastFxFabulous', providers.gradleProperty('blastFxFabulous').isPresent().toString()
        jvmArguments.addAll '-Xmx3G', '-XX:ActiveProcessorCount=4'
        programArguments.addAll '--width', '640', '--height', '480'
    }
    tasks.matching { it.name == 'runBlastFxCheck' }.configureEach {
        doLast {
            def result = new File(blastFxDirectory, 'blast-fx-check.txt')
            if (!result.exists() || !result.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("Blast FX client check failed: ${result}")
            }
            if (providers.gradleProperty('blastFxIncludeVolume').isPresent()) {
                def volume = new File(blastFxDirectory, 'blast-volume-check.txt')
                if (!volume.exists() || !volume.getText('UTF-8').startsWith('PASS')) {
                    throw new GradleException("Blast volume check failed: ${volume}")
                }
            }
            if (providers.gradleProperty('blastFxIncludeFlight').isPresent()) {
                def flight = new File(blastFxDirectory, 'missile-flight-check.txt')
                if (!flight.exists() || !flight.getText('UTF-8').startsWith('PASS')) {
                    throw new GradleException("Chained flight check failed: ${flight}")
                }
                def settings = new File(blastFxDirectory, 'missile-settings-check.txt')
                if (!settings.exists() || !settings.getText('UTF-8').startsWith('PASS')) {
                    throw new GradleException("Chained missile settings check failed: ${settings}")
                }
                def volume = new File(blastFxDirectory, 'blast-volume-check.txt')
                if (!volume.exists() || !volume.getText('UTF-8').startsWith('PASS')) {
                    throw new GradleException("Chained blast volume check failed: ${volume}")
                }
                def aim9 = new File(blastFxDirectory, 'aim9-client-check.txt')
                if (!aim9.exists() || !aim9.getText('UTF-8').startsWith('PASS')) {
                    throw new GradleException("Chained AIM-9 check failed: ${aim9}")
                }
            }
        }
    }
    dependencies {
        gameTestRuntimeOnly('maven.modrinth:create-aeronautics:1.3.2+mc1.21.1') { transitive = false }
        if (providers.gradleProperty('fxSodiumJar').isPresent()) {
            gameTestRuntimeOnly(files(providers.gradleProperty('fxSodiumJar').get()))
        }
        if (providers.gradleProperty('fxSodiumCoreJar').isPresent()) {
            gameTestRuntimeOnly(files(providers.gradleProperty('fxSodiumCoreJar').get()))
        }
        if (providers.gradleProperty('fxSodiumDepsDir').isPresent()) {
            gameTestRuntimeOnly(fileTree(providers.gradleProperty('fxSodiumDepsDir').get()) {
                include 'fabric-*.jar'
            })
        }
    }
    def ponderCheckDirectory = file("build/ponder-check/${System.currentTimeMillis()}")
    neoForge.runs.register('ponderCheck') {
        type = 'client'
        logLevel = org.slf4j.event.Level.INFO
        sourceSet = sourceSets.gameTest
        gameDirectory = ponderCheckDirectory
        systemProperty 'warnautics.ponderCheck', 'true'
        jvmArguments.addAll '-Xmx3G', '-XX:ActiveProcessorCount=4'
        programArguments.addAll '--width', '960', '--height', '720'
    }
    tasks.matching { it.name == 'runPonderCheck' }.configureEach {
        doLast {
            def result = new File(ponderCheckDirectory, 'ponder-check.txt')
            if (!result.exists() || !result.getText('UTF-8').startsWith('PASS')) {
                throw new GradleException("Ponder client check failed: ${result}")
            }
        }
    }
}
